name: Test Libraries
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main

jobs:
  Test-Libraries:  
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repo }}
          ref: ${{ github.ref }}

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'
          dotnet-quality: 'preview'
      - run: dotnet build <my project>
