name: Test Libraries
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main

jobs:
  Test-Libraries:  
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repo }}
          ref: ${{ github.ref }}

      - name: Tests
        run: make test
