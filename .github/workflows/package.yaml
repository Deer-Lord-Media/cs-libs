name: Package Libraries
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    types:
      - closed
env:
  PROJECT_NAME: Buffs
  PROJECT_VERSION: "1.0.0"

jobs:
  Package-Libraries:  
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repo }}
          ref: ${{ github.ref }}

      - name: Package Library
        run: dotnet pack $PROJECT_NAME --configuration Release

      - name: Publish Library
        run: dotnet nuget push "$PROJECT_NAME/bin/Release/$PROJECT_NAME.$PROJECT_VERSION.nupkg" --api-key ${{ secrets.NUGET_TOKEN }} --source "github"
