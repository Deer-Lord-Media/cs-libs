name: Package Libraries
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - '*/*.csproj'
permissions:
  contents: read
  packages: write

jobs:
  Package-Libraries:  
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - packageName: Buffs
            packageVersion: "0.0.2"
          - packageName: Inventory
            packageVersion: "0.0.2"
          - packageName: Quests
            packageVersion: "0.0.2"
          - packageName: Resource
            packageVersion: "0.0.2"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repo }}
          ref: ${{ github.ref }}
      - name: Setup Dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'
      - name: Package Library
        run: dotnet pack ${{ matrix.packageName }} --configuration Release
      - name: Publish Library
        run: dotnet nuget push --skip-duplicate "${{ matrix.packageName }}/bin/Release/${{ matrix.packageName }}.${{ matrix.packageVersion }}.nupkg" --source "https://nuget.pkg.github.com/Deer-Lord-Media/index.json" --api-key ${{ secrets.NUGET_TOKEN }}
