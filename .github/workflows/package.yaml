name: Package Libraries
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - '*/*.csproj'
permissions:
  contents: read
  packages: write

jobs:
  Package-Libraries:  
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - packageName: Buffs
            packageVersion: "0.0.4"
          - packageName: CoolDown
            packageVersion: "0.0.1"
          - packageName: Quests
            packageVersion: "0.0.3"
          - packageName: Resource
            packageVersion: "0.0.3"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repo }}
          ref: ${{ github.ref }}
      # - name: Install Dotnet Manually
      #   run: |
      #     sudo apt-get update -y
      #     sudo apt-get install -y dotnet-sdk-7.0
      # - name: Setup Dotnet
      #   uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: '7.0.x'
      - name: Package Library
        run: dotnet pack ${{ matrix.packageName }} --configuration Release
      - name: Publish Library
        run: dotnet nuget push --skip-duplicate "${{ matrix.packageName }}/bin/Release/${{ matrix.packageName }}.${{ matrix.packageVersion }}.nupkg" --source "https://nuget.pkg.github.com/Deer-Lord-Media/index.json" --api-key ${{ secrets.GITHUB_TOKEN }}
