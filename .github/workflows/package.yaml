name: Package Libraries
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - '*/*.csproj'
permissions:
  contents: read
  packages: write

jobs:
  Package-Libraries:  
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - packageName: Buffs
            packageVersion: "0.0.1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repo }}
          ref: ${{ github.ref }}

      - name: Package Library
        run: dotnet pack ${{ matrix.packageName }} --configuration Release

      - name: Publish Library
        run: dotnet nuget push --skip-duplicate "${{ matrix.packageName }}/bin/Release/${{ matrix.packageName }}.${{ matrix.packageVersion }}.nupkg" --source "github" --api-key ${{ secrets.NUGET_TOKEN }}
