name: Package Libraries
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - '*/*.csproj'
env:
  PROJECT_VERSION: "1.0.0"
permissions:
  packages: write
  contents: read


jobs:
  Package-Libraries:  
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        - packageName: Buffs
          packageVersion: "1.0.0"  # get dynamically

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repo }}
          ref: ${{ github.ref }}

      - name: Package Library
        run: dotnet pack ${{ matrix.packageName }} --configuration Release

      - name: Publish Library
        run: dotnet nuget push "${{ matrix.packageName }}/bin/Release/${{ matrix.packageName }}.${{ matrix.packageVersion }}.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "github"
