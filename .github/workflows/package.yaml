name: Package Libraries
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  Test-Libraries:  
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repo }}
          ref: ${{ github.ref }}

