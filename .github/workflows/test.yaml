name: Test Library
on:
  workflow_dispatch:
    # inputs:
    #   MODULE:
    #     description: 'name of the module'
    #     required: true
  pull_request:
    branches:
      - main

jobs:
  Test-Library:  
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
    steps:
      # needs to be addable even if it exists
      - name: Add or Update NuGet Source
        run: |
          SOURCE_NAME="deer-lord-media"
          SOURCE_URL="https://nuget.pkg.github.com/Deer-Lord-Media/index.json"
          USERNAME="${{ secrets.NUGET_USERNAME }}"
          PASSWORD="${{ secrets.NUGET_READ_TOKEN }}"

          EXISTING=$(dotnet nuget list source | grep "$SOURCE_NAME" || true)
          if [ -n "$EXISTING" ]; then
            echo "Source '$SOURCE_NAME' already exists. Updating it..."
            dotnet nuget update source "$SOURCE_NAME" \
              --source "$SOURCE_URL" \
              --username "$USERNAME" \
              --password "$PASSWORD" \
              --store-password-in-clear-text
          else
            echo "Adding new source '$SOURCE_NAME'..."
            dotnet nuget add source "$SOURCE_URL" \
              --name "$SOURCE_NAME" \
              --username "$USERNAME" \
              --password "$PASSWORD" \
              --store-password-in-clear-text
          fi
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repo }}
          ref: ${{ github.ref }}  
      - name: Build Projects
        run: make build-all
      - name: Test Libraries
        run:  make test-all
