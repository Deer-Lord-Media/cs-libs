name: Test Library
on:
  workflow_dispatch:
    inputs:
      MODULE:
        description: 'Name of the module'
        required: true
        default: 'CoolDown'
  pull_request:
    branches:
      - main

jobs:
  Test-Library:  
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      # matrix:
      #   include:
      #     - packageName: CoolDown
    env:
      GITHUB_USERNAME: ${{ secrets.NUGET_USERNAME }}
      GITHUB_TOKEN: ${{ secrets.NUGET_TOKEN }}
      MODULE: ${{ github.event.inputs.MODULE }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repo }}
          ref: ${{ github.ref }}  
      - name: Build Container
        # run: make build MODULE=${{ matrix.packageName }}
        run: make build
      - name: Test Library
        # run: make test MODULE=${{ matrix.packageName }}
        run:  make test
