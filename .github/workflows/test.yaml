name: Test Library
on:
  workflow_dispatch:
    # inputs:
    #   MODULE:
    #     description: 'name of the module'
    #     required: true
  pull_request:
    branches:
      - main

jobs:
  Test-Library:  
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
    env:
      GITHUB_USERNAME: ${{ secrets.NUGET_USERNAME }}
    steps:
      - name: Authenticate to GitHub Packages
        run: |
          dotnet nuget add source \
            --name "github" \
            --username "github-actions" \
            --password "${{ secrets.NUGET_READ_TOKEN }}" \
            --store-password-in-clear-text \
            https://nuget.pkg.github.com/Deer-Lord-Media/index.json
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repo }}
          ref: ${{ github.ref }}  
      - name: Build Projects
        run: make build-all
      - name: Test Libraries
        run:  make test-all
