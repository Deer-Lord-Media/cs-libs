name: Test Library
on:
  workflow_dispatch:
    # inputs:
    #   MODULE:
    #     description: 'name of the module'
    #     required: true
  pull_request:
    branches:
      - main

jobs:
  Test-Library:  
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
    steps:
      # needs to be addable even if it exists
      - name: Authenticate to GitHub Packages
        run: |
          dotnet nuget update source \
            --name "deer-lord-media" \
            --username "${{ secrets.NUGET_USERNAME }}" \
            --password "${{ secrets.NUGET_READ_TOKEN }}" \
            --store-password-in-clear-text \
            -- source https://nuget.pkg.github.com/Deer-Lord-Media/index.json
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repo }}
          ref: ${{ github.ref }}  
      - name: Build Projects
        run: make build-all
      - name: Test Libraries
        run:  make test-all
