name: Test Library
on:
  workflow_dispatch:
    # inputs:
    #   MODULE:
    #     description: 'name of the module'
    #     required: true
  pull_request:
    branches:
      - main

jobs:
  Test-Library:  
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
    steps:
      # needs to be addable even if it exists
      - name: Add or Update NuGet Source
        run: |
          set -e

          SOURCE_NAME="deer-lord-media"
          SOURCE_URL="https://nuget.pkg.github.com/Deer-Lord-Media/index.json"
          USERNAME="${{ secrets.NUGET_USERNAME }}"
          PASSWORD="${{ secrets.NUGET_READ_TOKEN }}"

          # Get the list of configured sources
          SOURCES=$(dotnet nuget list source)

          # Check if the source name already exists
          if echo "$SOURCES" | grep -q "$SOURCE_NAME"; then
            echo "Source name '$SOURCE_NAME' already exists. Updating it..."
            dotnet nuget update source "$SOURCE_NAME" \
              --source "$SOURCE_URL" \
              --username "$USERNAME" \
              --password "$PASSWORD" \
              --store-password-in-clear-text

          # Or check if the URL is already added under a different name
          elif echo "$SOURCES" | grep -q "Source: $SOURCE_URL"; then
            echo "A source with URL '$SOURCE_URL' already exists under a different name."
            echo "You may want to update or remove it manually."
            # Optional: Remove it here if desired
            # EXISTING_NAME=$(dotnet nuget list source | awk -v url="$SOURCE_URL" '
            #   BEGIN { name = "" }
            #   $1 == "Name:" { name = $2 }
            #   $1 == "Source:" && $2 == url { print name }
            # ')
            # if [ -n "$EXISTING_NAME" ]; then
            #   echo "Removing existing source with name $EXISTING_NAME"
            #   dotnet nuget remove source "$EXISTING_NAME"
            # fi

          else
            echo "Adding new source '$SOURCE_NAME'..."
            dotnet nuget add source "$SOURCE_URL" \
              --name "$SOURCE_NAME" \
              --username "$USERNAME" \
              --password "$PASSWORD" \
              --store-password-in-clear-text
          fi
      - name: Restore
        run: dotnet restore ./src
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repo }}
          ref: ${{ github.ref }}  
      - name: Build Projects
        run: make build-all
      - name: Test Libraries
        run:  make test-all
