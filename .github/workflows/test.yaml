name: Test Library
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main

jobs:
  Test-Library:  
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - packageName: CoolDown
    env:
      HOME: "/tmp"
      DOTNET_CLI_HOME: "/tmp"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repo }}
          ref: ${{ github.ref }}  
      - name: Build Container
        run: make build MODULE=${{ matrix.packageName }} GITHUB_USERNAME="${{ secrets.NUGET_USERNAME }}" GITHUB_TOKEN=${{ secrets.NUGET_TOKEN}}
      - name: Test Library
        run: make build MODULE=${{ matrix.packageName }} GITHUB_USERNAME="${{ secrets.NUGET_USERNAME }}" GITHUB_TOKEN=${{ secrets.NUGET_TOKEN}}
